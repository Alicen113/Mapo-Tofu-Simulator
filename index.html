</style></head><body>
<canvas id="view" aria-label="麻婆豆腐の調理場"></canvas>
<header class="panel"><h1>麻婆豆腐シミュレーター</h1><small>HANDCRAFTED COOKING ATELIER · 食材の皮・繊維・断面を再現</small><span id="step"></span><button id="sound">音 ON</button><select id="bgmSelect" aria-label="BGMの選択" style="font:inherit;max-width:160px;padding:8px;border-radius:9px;background:#443024;color:#fff0db;border:1px solid #b9834966"><option value="chinese">BGM：中華風</option><option value="lofi">BGM：chill Lo-fi</option><option value="calm">BGM：落ち着いた曲</option><option value="upbeat">BGM：ノリノリな曲</option></select><button id="reset" title="具材選択から最初に戻る">↻ やり直し</button></header>
<section id="info" class="panel"><h2 id="title"></h2><p id="help"></p><div id="stats"></div><div id="meters"></div><div id="progress"><div id="bar"></div></div></section>
<div id="buttons" aria-label="具材と調理道具の選択"></div>
<div id="bottom"><div id="controls" class="panel"><div id="heatrow"><label id="heatlabel" for="heat">火加減</label><input id="heat" type="range" min="0" max="100" value="0" tabindex="-1" aria-hidden="true"><button id="heatdial" type="button" role="slider" aria-labelledby="heatlabel" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" title="ダイヤルを回す／上下にドラッグ。矢印キーでも調整できます"><span id="dialneedle"></span></button><div id="diallabels">消火 · 弱 · 中 · 強</div><span id="heattext"></span><button id="off">消火</button></div></div><button id="next">仕込み開始 →</button></div>
<div id="toast" role="status"></div>
<section id="result" class="panel"><h2 id="dishname"></h2><div id="score"></div><p id="review"></p><div id="detail"></div><button id="restart">もう一度つくる</button></section>

<script>
// メイン処理の構文・実行エラーも捕捉できるよう、別スクリプトで先に登録。
(function(){
  function showError(message){
    var box=document.getElementById('engine-error');
    if(!box){
      box=document.createElement('div');box.id='engine-error';box.setAttribute('role','alert');
      box.style.cssText='position:fixed;z-index:100;left:12px;right:12px;top:85px;max-height:65vh;overflow:auto;padding:20px;background:#331b16;color:#fff0db;border:1px solid #e99563;border-radius:12px;white-space:pre-wrap;font:14px/1.7 system-ui';
      document.body.appendChild(box);
    }
    box.textContent='調理画面でエラーが発生しました。\n'+message+'\n\nページを再読み込みしても続く場合は、このエラー内容をお知らせください。';
    console.error(message);
  }
  window.addEventListener('error',function(e){showError(e.message+(e.lineno?'\n行: '+e.lineno:''));});
  window.addEventListener('unhandledrejection',function(e){showError(String(e.reason&&e.reason.message||e.reason));});
})();
</script>
<script>
'use strict';
// 外部依存なし。透視投影・押し出しポリゴン・照明・影・簡易物理をCanvas 2Dで実装。
const $=id=>document.getElementById(id),canvas=$('view'),ctx=canvas.getContext('2d');
if(!ctx)throw new Error('Canvas 2Dを初期化できません。対応ブラウザで開いてください。');
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)),rnd=(a,b)=>a+Math.random()*(b-a),TAU=Math.PI*2;
const ingredients=[['negi','長ネギ','#acd66a','mince'],['nira','ニラ','#479f45','mince'],['ginger','しょうが','#ddbd70','mince'],['garlic','にんにく','#eee2ba','mince']];
function ingredientPosition(i){return {x:(i-(ingredients.length-1)/2)*2.8,z:0};}
function freeKnife(){return stage===1&&isHerb(current());}
const names={tofu:'豆腐',...Object.fromEntries(ingredients.map(x=>[x[0],x[1]]))};
const topDefs=[['sesame','ごま油','#e4b743',.42],['pepper','花椒','#63382b',.3],['chili','ラー油','#ee4c20',.3],['scallion','青ネギ','#58b347',.38],['cilantro','パクチー','#3d9c55',.25],['threads','糸唐辛子','#ca3329',.25]];
let W,H,DPR,stage=0,elapsed=0,t=0,last=0,heat=0,selected=new Set(),queue=[],prep=0,pieces=[],recipe=[],meat=[],drops=[],steam=[],garnish=[],clumps=[];
const portions=Object.fromEntries(ingredients.map(d=>[d[0],0]));
// レシピ基準：1〜2人分。調味料は加熱・撹拌の進行に合わせて投入する。
const recipeSpec={tofu:230,beef:50,broth:160,douban:1};
let aromaProgress=0,seasoningProgress=0,aromaStarted=false,sauceStarted=false,brothAdded=false;
let doubanAmount=0;
selected.add('negi');portions.negi=1;
let saladOilAdded=false,cutIngredientsAdded=false,seasoningsAdded=false,beefAdded=false;
const seasoningDefs=[
 ['touchi','豆豉醤','大さじ1強'],['douban','豆板醤','小さじ1'],
 ['soy','しょうゆ','大さじ1'],['wine','紹興酒','大さじ1'],
 ['broth','鶏ガラスープ','160ml'],['sugar','砂糖','ひとつまみ'],
 ['sesame','ごま油','大さじ1弱'],['chili','ラー油','大さじ1弱']
];
const seasoningAmounts=Object.fromEntries(seasoningDefs.map(d=>[d[0],0]));
let selectedSeasoning='touchi';
function spawnBeef(){
 for(let i=0;i<130;i++){
  const x=(i%13-6)*.13,z=(Math.floor(i/13)-4.5)*.13;
  meat.push({x,z,bx:x,bz:z,y:wokHeight(Math.hypot(x,z))+.13,vx:0,vz:0,vy:0,r:rnd(.085,.105),color:i%3?'#ed817b':'#d94e52',sauce:false,out:false});
 }
}
function addStirIngredient(kind){
 if(stage!==2)return;
 if(kind==='oil'){if(saladOilAdded)return;saladOilAdded=true;animateIngredient('oil');toast('サラダ油 大さじ1〜2を入れました');}
 if(kind==='cut'){
  if(cutIngredientsAdded)return;
  if(!saladOilAdded){toast('先にサラダ油を入れてください');return;}
  cutIngredientsAdded=true;
  stirHerbs=pieces.filter(p=>isHerb(p.type)).map(p=>{
   // 刻んだ全断片の輪郭・厚み・食材種・相対配置をそのまま継承する。
   const poly=p.poly.map(v=>({x:v.x*.47,z:v.z*.47}));
   return {...p,poly,h:p.h*.66,y:2.4,vx:0,vz:0,vy:0};
  });
  animateIngredient('herbs');
  toast('工程1で刻んだ香味野菜を投入：'+([...selected].map(id=>names[id]).join('・')||'選択なし'));
 }
 if(kind==='beef'){
  if(beefAdded)return;
  if(!saladOilAdded){toast('先にサラダ油を入れてください');return;}
  beefAdded=true;spawnBeef();animateIngredient('beef');toast('牛ひき肉50gをブロック状で投入しました');
 }
 noiseSE('pour',.4);ui();status();
}
function addSelectedSeasoning(){
 if(stage!==2)return;
 const id=selectedSeasoning,def=seasoningDefs.find(d=>d[0]===id);
 if(id==='douban'){
  const before=doubanAmount;addDouban();seasoningAmounts.douban=doubanAmount;
  if(doubanAmount>before){animateIngredient('douban');toast('豆板醤 小さじ¼を追加（合計 '+doubanAmount.toFixed(2)+'）');}
 }else{
  if(seasoningAmounts[id]>=1){toast(def[1]+'は基準量を投入済みです');return;}
  seasoningAmounts[id]=1;animateIngredient(id);noiseSE('pour',.4);
  if(id==='touchi')for(let i=0;i<18;i++){const a=i*2.39996,r=.2+(i%5)*.22;meat.push({x:Math.cos(a)*r,z:Math.sin(a)*r,y:2.6,vx:0,vz:0,vy:-1,r:.055,color:'#87422b',sauce:true,out:false});}
  if(id==='broth')brothAdded=true;
  if(id==='sesame'||id==='chili'){
   glaze=clamp(glaze+.08);
   for(let i=0;i<12;i++){const a=i*2.39996,r=.5+(i%4)*.4;garnish.push({x:Math.cos(a)*r,z:Math.sin(a)*r,y:1.25,r:.07,type:id,angle:a});}
  }
  toast(def[1]+' '+def[2]+'を投入しました');
 }
 seasoningsAdded=!!(seasoningAmounts.touchi&&seasoningAmounts.soy&&seasoningAmounts.wine);
 ui();status();
}
// 刻み薬味の実体数を制限。限界後も細かさ・操作回数の評価を継続する。
// 上限到達を理由に切断を無効化しない。描画はバッチ化したまま維持。
const HERB_LIMIT=Infinity;
let stirHerbs=[],seasoningFilms=[],pourAnimation=null;
function isHerb(type){return ['negi','nira','ginger','garlic'].includes(type);}
// 厚みは仕込み時・投入時とも1cm固定。切った豆腐をそのまま1セット投入。
const TOFU_SCALE=2.8/8.3;
const tofuHeightCm=1;
let knifeDirection='horizontal',tofuLayerCut=false;
function cutTofuThickness(){
 if(stage!==1||current()!=='tofu')return;
 if(tofuLayerCut){toast('横切り済みです。高さは選択欄から調整できます。');return;}
 const source=pieces.filter(p=>p.type==='tofu');
 const targetH=tofuHeightCm*TOFU_SCALE,copies=[];
 for(const p of source){
  p.h=targetH;const copy={...p,poly:p.poly.map(v=>({x:v.x,z:v.z})),vx:0,vz:0,vy:0,y:.29};
  // 二枚を前後に分けて置き、両方を引き続き刻めるようにする。
  p.poly=p.poly.map(v=>({x:v.x,z:v.z-1.4}));copy.poly=copy.poly.map(v=>({x:v.x,z:v.z+1.4}));copies.push(copy);
 }
 pieces.push(...copies);tofuLayerCut=true;noiseSE('cut',.8);toast(tofuHeightCm.toFixed(1)+'cm厚の2枚に横切りしました');ui();status();
}
function tofuAmountMultiplier(){return 1;}
const plateThemes=[
 {name:'青花の中華皿',body:'#faf9ec',inner:'#f0f1e5',shade:'#d0ddd8',ink:'#254f78',gold:'#b18a47',flower:'#ad4736'},
 {name:'朱赤と金の中華皿',body:'#a92f25',inner:'#bd4131',shade:'#70261f',ink:'#f0c269',gold:'#f3d18a',flower:'#f6cf7b'},
 {name:'黒釉の中華皿',body:'#303a3c',inner:'#41494a',shade:'#171f22',ink:'#b4ced0',gold:'#c7a467',flower:'#d1a361'},
 {name:'翡翠の中華皿',body:'#a3cdb7',inner:'#c8dfcc',shade:'#6b9c8b',ink:'#316859',gold:'#bba16c',flower:'#f0e5b5'}
];
let plateStyle=0;
function plateButtons(){plateThemes.forEach((theme,i)=>addButton('皿：'+theme.name,()=>{plateStyle=i;ui();},plateStyle===i));}

  if(id==='sugar')for(let i=0;i<14;i++)meat.push({x:rnd(-.8,.8),z:rnd(-.8,.8),y:2.8,vy:-1,vx:0,vz:0,r:.026,color,sauce:true,out:false,sugar:true});
  else for(let i=0;i<14;i++)seasoningFilms.push({x:rnd(-1.5,1.5),z:rnd(-1.5,1.5),r:rnd(.12,.26),color,id,age:0});

function updateIngredientVisuals(dt){
 if(pourAnimation){pourAnimation.life-=dt;if(pourAnimation.life<=0)pourAnimation=null;}
 if(stage===2){
  for(const p of stirHerbs){
   p.vy-=6*dt;p.y+=p.vy*dt;movePiece(p,p.vx*dt,p.vz*dt);p.vx*=Math.exp(-dt*4);p.vz*=Math.exp(-dt*4);
   const c=center(p.poly),b=bounds(p.poly),reach=Math.hypot(b.w,b.d)*.5,limit=Math.max(.1,2.45-reach),r=Math.hypot(c.x,c.z);
   if(r>limit)movePiece(p,c.x*(limit/r-1),c.z*(limit/r-1));
   const cc=center(p.poly),floor=wokHeight(Math.hypot(cc.x,cc.z)+reach)+.06;
   if(p.y<floor){p.y=floor;p.vy=0;}
   settleToWokCenter(p,cc.x,cc.z,floor,dt);
  }
  for(const f of seasoningFilms){f.age+=dt;if(agitation>.1){const a=dt*agitation*.3,x=f.x;f.x=x*Math.cos(a)-f.z*Math.sin(a);f.z=x*Math.sin(a)+f.z*Math.cos(a);}}

 }
}

// 肉は挽いた筋を含む不揃いな塊、醤は油を含んだペーストとして描画。
function drawMinceOrPaste(m,y,color,index){
 const seed=index*2.39996323, r=m.r;
 if(!m.sauce){
  // 固定シードの肉塊と短い挽き筋。毎フレーム乱数を使わず形を維持する。
  const ca=Math.cos(seed),sa=Math.sin(seed),browning=clamp(cook/.75),char=clamp((burn-.6)/.4);
  ball(m.x,y,m.z,r*(1+.14*Math.sin(seed*3)),color,.66);
  const details=meat.length>220?0:1;
  for(let j=0;j<details;j++){
   const u=(j-1)*r*.42,shift=Math.sin(seed+j*2)*r*.28;
   const ax=m.x+ca*u-sa*shift,az=m.z+sa*u+ca*shift;
   const bx=ax+ca*r*.85,bz=az+sa*r*.85;
   ball(ax,y+r*.14,az,r*.47,shade(color,j%2?.9:1.1),.65);
   line3([ax,y+r*.35,az],[bx,y+r*.31,bz],shade(color,j%2?.79:1.14),r*.28);
  }
  if(index%8===0){
   const fat=browning<.4?'#efd6c7':'#d6b58a';
   ball(m.x-sa*r*.35,y+r*.4,m.z+ca*r*.35,r*.22,shade(fat,1-char*.9),.6);
  }
  return;
 }
 if(index%3!==0||meat.length>350){ball(m.x,y,m.z,r*1.4,color,.48);return;}
 if(m.sauce){
  ball(m.x,y,m.z,r*1.55,color,.48);
  ball(m.x+Math.cos(seed)*r*.6,y+r*.12,m.z+Math.sin(seed)*r*.55,r*.75,shade(color,1.15),.52);
  if(index%3===0){
   const a=seed,dx=Math.cos(a)*r*.55,dz=Math.sin(a)*r*.55;
   line3([m.x-dx,y+r*.35,m.z-dz],[m.x+dx,y+r*.35,m.z+dz],shade(color,1.42),r*.28);
   ball(m.x+r*.3,y+r*.42,m.z-r*.18,r*.16,'#e6ab62',.48);
  }
 }else{
  ball(m.x,y,m.z,r,color,.73);
  if(index%2===0){
   const dx=Math.cos(seed)*r*.52,dz=Math.sin(seed)*r*.52;
   ball(m.x+dx,y+r*.22,m.z+dz,r*.63,shade(color,.91),.7);
   line3([m.x-dx*.6,y+r*.65,m.z-dz*.6],[m.x+dx*.65,y+r*.68,m.z+dz*.65],shade(color,1.17),r*.23);
  }
  // 肉の中に見える白い脂身も、加熱とともに飴色へ。
  if(index%5===0)ball(m.x-r*.25,y+r*.68,m.z+r*.18,r*.23,cook<.3?'#efd4c5':'#cfaa79',.6);
 }
}
// 青白磁の高台付き中華皿。反り上がった縁、呉須の雷文、朱と金の花文。
function chinesePlate(){
 const theme=plateThemes[plateStyle];
 renderLayer=1;
 extrude(ellipsePoly(0,0,1.75,1.75,64),.10,.25,'#c0d0cc');
 disk(0,.105,0,1.62,'#91aaa9',64);
 // 回転しても壊れない一括描画。放射状の面を個別に深度ソートしない。
 const n=64;
 const plateRings=[[3.87,1.025,theme.shade],[3.82,1.06,theme.body],[3.73,1.065,theme.body],[3.30,.97,theme.inner],[3.05,.80,theme.shade],[2.82,.66,theme.shade],[2.64,.56,theme.inner],[2.38,.52,theme.inner]];
 const rings=plateRings.map(([r,y,color])=>({color,points:Array.from({length:n},(_,i)=>project(Math.cos(i/n*TAU)*r,y,Math.sin(i/n*TAU)*r))}));
 renderList.push({layer:1.1,d:0,run(){ctx.save();for(const ring of rings){ctx.beginPath();ring.points.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();ctx.fillStyle=ring.color;ctx.fill();ctx.strokeStyle=ring.color;ctx.lineWidth=.7;ctx.stroke();}ctx.restore();}});
 // 縁の装飾は皿本体より後、料理より前に固定。
 renderLayer=1.2;
 function rim(radius,y,color,width){for(let i=0;i<n;i++){let a=i/n*TAU,b=(i+1)/n*TAU;line3([Math.cos(a)*radius,y,Math.sin(a)*radius],[Math.cos(b)*radius,y,Math.sin(b)*radius],color,width);}}
 rim(3.84,1.06,theme.gold,.035);rim(3.73,1.075,theme.ink,.04);rim(3.30,.97,theme.ink,.035);rim(2.89,.715,theme.flower,.025);
 // 角張った連続雷文を縁の帯に配置。
 for(let i=0;i<40;i++){
  const a=i/40*TAU;
  const path=[[-.057,3.39],[-.057,3.63],[.044,3.63],[.044,3.47],[-.012,3.47],[-.012,3.56]];
  for(let j=0;j<path.length-1;j++){
   let [da,ra]=path[j],[db,rb]=path[j+1];
   line3([Math.cos(a+da)*ra,1.072,Math.sin(a+da)*ra],[Math.cos(a+db)*rb,1.072,Math.sin(a+db)*rb],theme.ink,.022);
  }
 }
 for(let i=0;i<8;i++){
  let a=i/8*TAU,x=Math.cos(a)*3.12,z=Math.sin(a)*3.12;
  for(let j=0;j<5;j++){let b=j/5*TAU;disk(x+Math.cos(b)*.07,.90,z+Math.sin(b)*.07,.055,theme.flower,8);}
  disk(x,.905,z,.035,theme.gold,8);
 }
}

if(stage===1){let id=current(),def=ingredients.find(x=>x[0]===id),group=def?.[3]||'dice',n=cutRecords[id].strokes.length,ps=pieces.filter(p=>p.type===id);text=`${names[id]}　${prep+1}/${queue.length}品\n${group==='mince'?'往復して細かく：回数＋密集度':group==='loose'?'優しく3〜5回：やりすぎ注意':'目分量の格子切り：等間隔＋直角'}\nスワイプ ${n}回 / ${ps.length}片\n${id==='tofu'?'厚み：'+tofuHeightCm.toFixed(1)+'cm / 切った量をそのまま投入\n包丁：'+(knifeDirection==='vertical'?'縦 ↕':'横 ↔')+'（始点を通る直線）\n':''}${group==='dice'?'サイコロ精度 '+Math.round(strokeQuality(id)*50)+' / 50点':'仕込み精度 '+Math.round(strokeQuality(id)*100)+'%'}\n全体の包丁評価 ${Math.round(quality()*100)}%`;q=quality();}
if(stage===2){text=`${aromaProgress<1?'① 香味野菜を油で炒める':cook<.9?'② 牛ひき肉50gをほぐして炒める':'③ 豆豉醤・しょうゆ・紹興酒を馴染ませる'}\n投入：油${saladOilAdded?'✓':'未'}・ひき肉${beefAdded?'✓':'未'}・香味野菜${cutIngredientsAdded?'✓':'未'}\n調味料：${seasoningDefs.filter(d=>d[0]==='douban'?doubanAmount>0:seasoningAmounts[d[0]]>0).map(d=>d[1]).join('・')||'未投入'}\n香味 ${Math.round(aromaProgress*100)}% / 調味 ${Math.round(seasoningProgress*100)}%\n炒まり ${Math.round(cook*100)}% / 醤の馴染み ${Math.round(mixed*100)}%\n鍋振り ${flips}回 / 焦げ ${Math.round(burn*100)}%\n豆板醤 小さじ${doubanAmount.toFixed(2)}（基準1）\n飛散ロス ${Math.round(lost*100)}% / ${elapsed.toFixed(1)}秒\n工程評価 ${Math.round(quality()*100)} / 100`;q=quality();}
if(stage===3){text=`絹ごし豆腐230g / 厚み${tofuHeightCm.toFixed(1)}cm\n鶏ガラスープ160ml・砂糖ひとつまみ\n適温煮込み ${simmer.toFixed(1)}秒（目安5〜7秒）\nスープ残量 ${Math.round(soup*100)}%（目安76%）\n豆腐の崩壊 ${Math.round(damage*100)}%\n工程評価 ${Math.round(quality()*100)} / 100`;q=quality();}
if(stage===4){text=`① 弱火・消火 ${lowFirst?'✓':'未達'}\n② 片栗粉 ${Math.round(starch/.58*100)}% / 基準：小さじ1＋水小さじ2\n回し入れ ${(pourCircle/TAU).toFixed(1)}周 / 撹拌 ${Math.round(mix*100)}%\n白いダマ ${clumps.length}個\n③ 強火鍋振り ${emulsify}回 / ツヤ ${Math.round(glaze*100)}%\nとろみ ${Math.round(viscosity*100)}% · ${viscosity<.25?'サラサラ':viscosity<.65?'とろみが出てきた':'ドロッと濃厚なあん'}\n工程評価 ${Math.round(quality()*100)} / 100`;q=quality();}
if(stage===5){text='上部の皿ボタンでデザインを即時変更\nごま油：ふちに沿って円ドラッグ\n花椒：左右往復 / ラー油：タップ・なぞる\n青ネギ・パクチー：タップ\n糸唐辛子：ドラッグで中央へ\n仕上げは採点なし。好きな量でどうぞ。';for(const [id,name,,target]of topDefs){let row=document.createElement('div');row.className='meter';let span=document.createElement('span');span.textContent=name+' '+Math.round(topAmounts[id]*100);let bar=document.createElement('i');bar.style.width=Math.min(130,topAmounts[id]/target*65)+'px';bar.style.background='#efb46b';row.append(span,bar);$('meters').append(row);}q=quality();}
if(stage===6){text='一品ずつ刻んだ、世界に一つだけの麻婆。\n360度の自動周回で仕上がりを鑑賞。';q=1;}$('stats').textContent=text;$('bar').style.width=clamp(q)*100+'%';}
function finish(){drops=[];steam=[];let total=Math.round(scores.reduce((a,b)=>a+b,0)/Math.max(1,scores.length)),rank=total>=90?'特級':total>=75?'上級':total>=55?'中級':'見習い';let name='手仕込みの四川風麻婆豆腐';if(selected.has('cheese')&&topAmounts.sesame>.1)name='コクと香りが引き立つ！まろやかチーズ麻婆豆腐';if((selected.has('negi')||topAmounts.scallion>.6)&&topAmounts.pepper>.55)name='痺れる旨さ！山盛りネギの本格四川風麻婆豆腐';if(topAmounts.cilantro>.4)name='香草が踊る！パクチーたっぷり麻婆豆腐';if(selected.size===ingredients.length&&topDefs.every(x=>topAmounts[x[0]]>.015))name='全具材＆トッピング制覇！神の領域の特級麻婆豆腐';$('dishname').textContent=name;$('score').textContent=total+'点 · '+rank;let reviews=[total>=80?'香りと食感が調和した、見事な職人の一皿。':'切り方も火加減も、あなただけの味わいになりました。'];if(selected.has('eggplant'))reviews.push('なすが旨辛のあんを吸い込み、ジューシー。');if(selected.has('cheese'))reviews.push('チーズのコクが刺激をやさしく包みます。');if(selected.has('shimeji'))reviews.push('しめじの旨味が奥行きをプラス。');if(topAmounts.pepper>.65)reviews.push('花椒ドバ盛りの、痺れを愛する仕上がり！');if(topAmounts.scallion>.65)reviews.push('ネギだくの鮮やかな香りと食感。');if(topAmounts.chili>.65)reviews.push('ラー油たっぷり、燃えるような辛さ。');if(topAmounts.threads>.1)reviews.push('糸唐辛子が中央を華やかに彩ります。');if(burn>.25)reviews.push('次は焦げる前に撹拌と鍋振りを。');if(damage>.25)reviews.push('おたまをゆっくり滑らせると、豆腐をもっと美しく保てます。');if(clumps.length>6)reviews.push('片栗粉は弱火で回し入れ、すぐ優しく混ぜましょう。');if(glaze>.7)reviews.push('強火で乳化したツヤが食欲を誘います。');$('review').textContent=reviews.join(' ');$('detail').textContent=['包丁（サイコロ50点基準を正規化）','炒め・キツネ色と醤','煮込み・残量と豆腐保護','とろみ・手順と乳化'].map((s,i)=>s+'\n'+scores[i].toFixed(1)+' / 100').join('\n')+'\n\n総合：4工程の平均 / 100点\n仕上げトッピング：採点対象外（自由な盛り付け）';if(ac){let now=ac.currentTime;[0,4,7,12].forEach((v,i)=>note(261.6*2**(v/12),now+i*.12,.6,.07,'triangle',master));}}
function resize(){const r=canvas.getBoundingClientRect();W=Math.max(1,r.width);H=Math.max(1,r.height);DPR=Math.min(devicePixelRatio||1,1);canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR);ctx.setTransform(DPR,0,0,DPR,0,0);camera();}
// UIの折り返し・工程切替・端末回転で描画領域が変わっても投影とタッチ座標を一致させる。
const viewportObserver=new ResizeObserver(()=>{resize();});viewportObserver.observe(canvas);
// 折り返した選択ボタンと情報パネルが重ならないよう追従。
function positionSelectionInfo(){const buttons=$('buttons');const bottom=buttons.childElementCount?buttons.getBoundingClientRect().bottom:(W<650?58:70);document.documentElement.style.setProperty('--info-top',(bottom+12)+'px');}
const selectionObserver=new ResizeObserver(positionSelectionInfo);selectionObserver.observe($('buttons'));
window.addEventListener('resize',()=>{resize();positionSelectionInfo();});document.addEventListener('visibilitychange',()=>{last=performance.now();release();if(ac){if(document.hidden)ac.suspend();else if(audioOn)ac.resume();}});
let uiClock=0;
let lastPaint=0;
function frame(now){
 requestAnimationFrame(frame);
 if(document.hidden){last=now;return;}
 // 60fpsを目標に描画。物理30Hz・情報表示4Hzは独立して負荷を抑える。
 // 実際のfpsは端末と食材数による。高リフレッシュ画面のみ過剰描画を抑制。
 if(now-lastPaint<1000/60-1)return;
 lastPaint=now;
 const dt=Math.min(.05,Math.max(0,(now-(last||now))/1000));last=now;
 t+=dt;update(dt);draw();uiClock+=dt;
 if(uiClock>.25){status();uiClock=0;}
}
// 初期描画を即座に行う。初期化に失敗した場合は上の診断表示へ。
resize();ui();status();draw();requestAnimationFrame(frame);
